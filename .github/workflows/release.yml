name: release

on:
  push:
    tags:
      - v**

permissions:
  contents: write

jobs:
  publish-verified-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify annotated tag and committed release artifact
        run: |
          python3 scripts/release-tags.py --tag "$GITHUB_REF_NAME"
          python3 scripts/verify-release.py
      - name: Publish the verified installer unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/zotero-metaflow.xpi --verify-tag --title "Zotero MetaFlow ${version}" --notes-file "docs/releases/metaflow-v${version}.md"
